# Sentinel-X broker: TLS only, authenticated clients, per-user ACL.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /run/sentinel/secrets/mosquitto-passwd
acl_file /run/sentinel/secrets/mosquitto-acl

# No plaintext listener: MQTT over TLS only (TLS 1.2 and 1.3).
listener 8883
protocol mqtt
cafile /run/sentinel/pki/ca.crt
certfile /run/sentinel/pki/mosquitto.crt
keyfile /run/sentinel/pki/mosquitto.key
