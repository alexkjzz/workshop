; SENTINEL-X - firmware ESP8266 (NodeMCU v2 / ESP-12E)
[platformio]
default_envs = nodemcuv2-local

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp8266_exception_decoder, time
board_build.f_cpu = 160000000L ; accelere la poignee de main TLS
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
check_tool = cppcheck
check_src_filters =
  +<src/>
  +<lib/sentinel_core/src/>
; Cppcheck 2.11 ne developpe pas les macros imbriquees du namespace ArduinoJson 7.4.
; L'alias est reserve a l'analyse. Les diagnostics des dependances tierces
; restent hors du perimetre ; ceux du code Sentinel ne sont pas desactives.
check_flags = cppcheck: --enable=warning,performance,portability --std=c++17 -DARDUINOJSON_VERSION_NAMESPACE=sentinel_cppcheck --suppress=*:*.pio/libdeps/*/ArduinoJson/src/*
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11

; Sketch local : vrais capteurs/LEDs/OLED, sans reseau ni secrets.h.
[env:nodemcuv2-local]
extends = env:nodemcuv2
build_flags =
  ${env:nodemcuv2.build_flags}
  -DSENTINEL_NETWORK_ENABLED=0

; Tests du coeur (lib/sentinel_core, sans Arduino) sur l'ordinateur : pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<infrastructure/telemetry_payload.cpp>
build_flags = -std=c++17 -Isrc
lib_deps = bblanchon/ArduinoJson@^7.2.0
